name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/nikhil-flux/shortlink-platform

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest -q

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Scan image with Trivy
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:0.57.1 image --severity CRITICAL,HIGH \
            --ignore-unfixed --exit-code 1 $IMAGE:${{ github.sha }}
      - name: Log in to GHCR
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push image
        if: github.ref == 'refs/heads/main'
        run: |
          docker tag $IMAGE:${{ github.sha }} $IMAGE:latest
          docker push $IMAGE:${{ github.sha }}
          docker push $IMAGE:latest

  k8s-smoke-test:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image locally
        run: docker build -t shortlink-platform:ci .
      - uses: helm/kind-action@v1
      - name: Deploy to kind
        run: |
          kind load docker-image shortlink-platform:ci --name chart-testing
          kubectl kustomize k8s/overlays/dev \
            | sed 's#ghcr.io/nikhil-flux/shortlink-platform:latest#shortlink-platform:ci#' \
            | kubectl apply -f -
          kubectl -n shortlink rollout status deploy/redis --timeout=120s
          kubectl -n shortlink rollout status deploy/shortlink --timeout=180s || {
            echo "::error::$(kubectl -n shortlink get pods -o wide; kubectl -n shortlink logs deploy/shortlink --tail=15 2>&1 | tr '\n' ' ')"; exit 1; }
      - name: Smoke test
        run: |
          kubectl -n shortlink port-forward svc/shortlink 8080:80 &
          sleep 5
          curl -fsS localhost:8080/healthz
          code=$(curl -fsS -X POST localhost:8080/api/shorten -H 'content-type: application/json' -d '{"url":"https://example.com"}' | python3 -c 'import sys,json; print(json.load(sys.stdin)["code"])')
          curl -fsS -o /dev/null -w '%{http_code}\n' localhost:8080/$code | grep 302
