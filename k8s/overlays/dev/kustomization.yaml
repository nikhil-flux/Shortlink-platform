apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
images:
  - name: ghcr.io/nikhil-flux/shortlink-platform
    newTag: latest
patches:
  - target: {kind: Deployment, name: shortlink}
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
